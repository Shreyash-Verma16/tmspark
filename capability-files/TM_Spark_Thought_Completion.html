'use strict';
const PREFIX="Hi Rahul, I'm sorry, but";
const COMP=" I won't be able to send the project today due to some unexpected issues. I'll send it tomorrow.";
const FULL=PREFIX+COMP;
const film=document.getElementById('film'),title=document.getElementById('title'), rig=document.getElementById('phone-rig'), draft=document.getElementById('draftText');
const iso=document.getElementById('iso'), spark=document.getElementById('spark'), detached=document.getElementById('detached'), auto=document.getElementById('auto'), typed=document.getElementById('typed');
const caret=document.getElementById('caret'), glow=document.getElementById('spark-aura'),halo=document.getElementById('connection-halo'), softglow=document.getElementById('softglow'), sheen=document.getElementById('spark-sheen');
const wires=[...document.querySelectorAll('.cable,.cable-sub')], paths=[...document.querySelectorAll('.cable')], packets=[...document.querySelectorAll('.packet')], keys=[...document.querySelectorAll('.key')];
const clamp=x=>Math.min(1,Math.max(0,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},easeOut=x=>1-Math.pow(1-clamp(x),3),lerp=(a,b,t)=>a+(b-a)*t,ph=(t,a,b)=>ease((t-a)/(b-a));
let manual=false,started=performance.now();
const keymap={};keys.forEach(k=>{let s=k.textContent.trim();if(s.length===1)keymap[s.toLowerCase()]=k});
function render(t){
 t=Math.max(0,Math.min(21,t));
 const ti=ph(t,.2,.73),to=1-ph(t,1.46,1.97);
 title.style.opacity=(ti*to).toFixed(3);title.style.transform=`translateY(calc(-50% + ${(1-ti)*18}px))`;
 const reveal=ph(t,2.05,3.2),push=ph(t,5.2,8.64),split=ph(t,8.7,10.3),rejoin=ph(t,18.4,19.45);
 const baseScale=lerp(.96,1.78,push),cameraLift=lerp(0,-325,push);
 const phoneScale=lerp(baseScale,1.18,rejoin),phoneY=lerp(cameraLift,-100,rejoin)+(1-reveal)*34;
 let phoneAlpha=reveal*(1-split)*(1-rejoin)+rejoin; if(t<2)phoneAlpha=0;
 rig.style.opacity=phoneAlpha.toFixed(4);rig.style.transform=`translate(-50%,-50%) translateY(${phoneY.toFixed(2)}px) scale(${phoneScale.toFixed(5)})`;
 // True incremental typing: the message remains inside the WhatsApp composer.
 const charCount=Math.max(0,Math.min(PREFIX.length,Math.floor(lerp(0,PREFIX.length,ph(t,4.9,8.0))*1.0001)));
 const phoneContent=t>=15.82?FULL:PREFIX.slice(0,charCount);
 if(draft.textContent!==phoneContent)draft.textContent=phoneContent;
 document.getElementById('inputShell').style.minHeight=`${lerp(67,92,ph(t,15.55,16.1)).toFixed(1)}px`;
 const nowTyping=(t>=4.9&&t<8.05);
 caret.style.opacity=(t>=9.25&&t<=14.85 && Math.sin(t*7)>0?.9:0);
 // Physical keyboard key response, synchronized with the current typed letter.
 keys.forEach(k=>k.classList.remove('pressing'));
 if(nowTyping){const c=PREFIX.charAt(Math.max(0,charCount-1)).toLowerCase(),k=keymap[c];if(k&&Math.sin(t*18)>0)k.classList.add('pressing')}
 // Composer isolation: the phone UI recedes as the original composer expands outward.
 const isolated=ph(t,8.70,10.10)*(1-ph(t,18.4,19.45));
 iso.style.opacity=isolated.toFixed(4);
 const solo=ph(t,8.7,10.32),goingBack=ph(t,17.9,19.45);
 const x=lerp(-368,0,solo), yy=lerp(-131,0,solo), sc=lerp(.708,1,solo);
 const xBack=lerp(x,-354,goingBack), yBack=lerp(yy,-20,goingBack), scBack=lerp(sc,.469,goingBack);
 detached.style.transform=`translate(${xBack.toFixed(2)}px,${yBack.toFixed(2)}px) scale(${scBack.toFixed(4)})`;
 // Glossy Spark module makes a deliberate sideways entrance, not a hard cut.
 const show=ph(t,10.36,11.45),unshow=1-ph(t,17.15,18.0),sparkVis=show*unshow;
 spark.style.opacity=sparkVis.toFixed(4);
 spark.style.transform=`translateX(${lerp(-76,0,show)+lerp(0,-90,1-unshow)}px) scale(${lerp(.89,1,show).toFixed(4)})`;
 const conn=ph(t,11.54,13.32)*(1-ph(t,16.93,17.82));
 wires.forEach((path,i)=>{const lag=(i%2)*.11;const amount=ph(t,11.58+lag,13.1+lag)*(1-ph(t,17.05,17.85));path.style.strokeDashoffset=(1200*(1-amount)).toFixed(2);path.style.opacity=(Math.min(1,amount*3)*unshow*(path.classList.contains('cable-sub')?.75:1)).toFixed(3)});
 const electric=ph(t,13.0,13.9)*(1-ph(t,16.55,17.6));
 glow.style.opacity=(.38*conn+Math.max(0,Math.sin(t*13))*.42*electric).toFixed(3);
 softglow.style.opacity=(.75*conn+.25*electric).toFixed(3);
 halo.style.opacity=(.46*conn+.35*electric).toFixed(3);
 spark.style.boxShadow=`0 35px 75px rgba(34,64,105,.15),0 8px 16px rgba(48,79,119,.09),0 0 ${Math.round(42*electric)}px rgba(77,163,255,${(.37*electric).toFixed(3)}),inset 2px 2px 3px rgba(255,255,255,1),inset -3px -5px 13px rgba(127,149,180,.15)`;
 sheen.style.transform=`translateX(${Math.round(lerp(-180,600,ph(t,13.08,14.45)))}px) skewX(-26deg)`;
 // Individual glowing packets of intelligence move through the real path geometry.
 packets.forEach((dot,j)=>{let p=paths[j%paths.length],total=p.getTotalLength(),prog=(t-13.35-j*.18)/1.28;let visible=conn*electric*(prog>0&&prog<1?1:0);let pt=p.getPointAtLength(clamp(prog)*total);dot.setAttribute('cx',pt.x.toFixed(2));dot.setAttribute('cy',pt.y.toFixed(2));dot.style.opacity=visible.toFixed(3)});
 // Completion resolves as a suggestion, then becomes readable text inside the same editor.
 const suggest=ph(t,14.12,14.98),resolved=ph(t,14.96,16.55);
 typed.textContent=PREFIX;
 auto.textContent=t<14.1?'':COMP;
 auto.style.opacity=(suggest*(.70+.30*resolved)).toFixed(4);
 auto.style.filter=`blur(${lerp(7,0,resolved).toFixed(2)}px)`;
 auto.style.color=resolved>.85?'#23303e':'#718da8';
 document.getElementById('detached').style.minHeight=`${lerp(143,222,ph(t,14.3,15.8)).toFixed(2)}px`;
 document.getElementById('detached').style.borderColor=electric>.1?'rgba(126,182,239,.45)':'#e7ecf2';
 // Going back: exact completed text is already present in the phone composer, no message is sent.
}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);film.style.transform=`translate(${Math.round((innerWidth-1920*s)/2)}px,${Math.round((innerHeight-1080*s)/2)}px) scale(${s})`}
addEventListener('resize',fit);fit();
window.seekFilm=t=>{manual=true;render(t);return true};window.startFilm=()=>{manual=false;started=performance.now()};
(function loop(){if(!manual)render(((performance.now()-started)/1000)%21);requestAnimationFrame(loop)})();render(0);
</script></body></html>
